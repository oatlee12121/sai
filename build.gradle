plugins { id 'fabric-loom' version "${loom_version}" }

version = '1.0.0'
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

def targetJava = 21
tasks.withType(JavaCompile).configureEach { it.options.release = targetJava }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }

jar { from('LICENSE') { rename { "${it}_${base.archivesName.get()}" } } }
